name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the job only needs to read the repo.
permissions:
  contents: read

# One run per branch/PR. A new push cancels the outdated run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate Docker Compose file
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.example config -q

      - name: Build and test
        run: ./mvnw -B verify
